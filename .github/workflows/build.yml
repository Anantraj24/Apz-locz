name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Optimized Release APK
      run: ./gradlew assembleRelease

    - name: Verify Merged Manifest (No INTERNET Permission)
      run: |
        if grep -q "android.permission.INTERNET" app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml; then
          echo "Error: INTERNET permission detected in merged manifest!"
          exit 1
        else
          echo "Verified: Manifest contains zero network permissions."
        fi

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: apz-locz-release-apk
        path: app/build/outputs/apk/release/app-release.apk

